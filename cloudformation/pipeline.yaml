AWSTemplateFormatVersion: '2010-09-09'
Description: 'CodePipeline for La Marzocco Dashboard - CI/CD Pipeline with GitHub integration'

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub repository owner
    Default: leozhad
  
  GitHubRepo:
    Type: String
    Description: GitHub repository name
    Default: la-marzocco-dashboard
  
  GitHubBranch:
    Type: String
    Description: GitHub branch to track
    Default: main
  
  DomainName:
    Type: String
    Description: Domain name for the dashboard
    Default: espresso.leozh.net

Resources:
  # S3 Bucket for CodePipeline artifacts
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-pipeline-artifacts-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30

  # Secrets Manager secret for La Marzocco credentials (shared between pipeline and app)
  LaMarzoccoCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-lamarzocco-credentials'
      Description: La Marzocco Cloud API credentials (shared secret)
      SecretString: !Sub |
        {
          "username": "PLACEHOLDER_USERNAME",
          "password": "PLACEHOLDER_PASSWORD"
        }
      Tags:
        - Key: Project
          Value: la-marzocco-dashboard
        - Key: ManagedBy
          Value: Pipeline

  # CodeBuild Service Role
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub '${ArtifactsBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt ArtifactsBucket.Arn

  # CodeBuild Project
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-build'
      Description: 'Build project for La Marzocco Dashboard'
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: false
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.12
            pre_build:
              commands:
                - echo Build started on `date`
                - echo Installing Python dependencies...
            build:
              commands:
                - echo Building Lambda deployment package...
                - mkdir -p lambda-package
                - cp src/lambda_function.py lambda-package/
                - cd lambda-package
                - pip install -r ../requirements.txt -t .
                - zip -r ../lambda-deployment-package.zip .
                - cd ..
                - echo Build completed on `date`
          artifacts:
            files:
              - '**/*'
      TimeoutInMinutes: 10

  # CloudFormation Service Role
  CloudFormationServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-cloudformation-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: CloudFormationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:CreateInstanceProfile
                  - iam:DeleteInstanceProfile
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource: '*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: 
                  - !Ref LaMarzoccoCredentials
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:la-marzocco-github-token-*'

  # CodePipeline Service Role
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codepipeline-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub '${ArtifactsBucket.Arn}/*'
                  - !GetAtt ArtifactsBucket.Arn
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt CodeBuildProject.Arn
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:UpdateStack
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt CloudFormationServiceRole.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt LambdaUpdateFunction.Arn

  # CodePipeline
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${AWS::StackName}-pipeline'
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              Configuration:
                Owner: !Ref GitHubOwner
                Repo: !Ref GitHubRepo
                Branch: !Ref GitHubBranch
                OAuthToken: !Sub '{{resolve:secretsmanager:la-marzocco-github-token:SecretString:token}}'
                PollForSourceChanges: true
              OutputArtifacts:
                - Name: SourceOutput

        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput

        - Name: Deploy
          Actions:
            - Name: CreateChangeSet
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CHANGE_SET_REPLACE
                StackName: la-marzocco-dashboard
                ChangeSetName: !Sub '${AWS::StackName}-changeset'
                TemplatePath: BuildOutput::cloudformation/main.yaml
                ParameterOverrides: !Sub |
                  {
                    "DomainName": "${DomainName}",
                    "LaMarzoccoSecretName": "${LaMarzoccoCredentials}"
                  }
                Capabilities: CAPABILITY_NAMED_IAM
                RoleArn: !GetAtt CloudFormationServiceRole.Arn
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 1

            - Name: ExecuteChangeSet
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CHANGE_SET_EXECUTE
                StackName: la-marzocco-dashboard
                ChangeSetName: !Sub '${AWS::StackName}-changeset'
              RunOrder: 2

            - Name: UpdateLambdaFunction
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Provider: Lambda
                Version: '1'
              Configuration:
                FunctionName: !Ref LambdaUpdateFunction
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 3

  # Lambda function to update the dashboard Lambda with new code
  LambdaUpdateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-update-lambda'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaUpdateRole.Arn
      Timeout: 60
      MemorySize: 512  # Increased from default 128 MB to handle large deployment packages
      Code:
        ZipFile: |
          import json
          import boto3
          import zipfile
          import tempfile
          import os
          
          def lambda_handler(event, context):
              try:
                  # Get CodePipeline job data
                  job_id = event['CodePipeline.job']['id']
                  input_artifacts = event['CodePipeline.job']['data']['inputArtifacts']
                  
                  # Get the S3 location of the build artifact
                  location = input_artifacts[0]['location']['s3Location']
                  bucket = location['bucketName']
                  key = location['objectKey']
                  
                  print(f"Processing artifact from s3://{bucket}/{key}")
                  
                  # Initialize clients
                  lambda_client = boto3.client('lambda')
                  s3_client = boto3.client('s3')
                  codepipeline_client = boto3.client('codepipeline')
                  
                  # Download the build artifact
                  with tempfile.NamedTemporaryFile() as temp_file:
                      s3_client.download_fileobj(bucket, key, temp_file)
                      temp_file.seek(0)
                      
                      # Extract the artifact and find lambda-deployment-package.zip
                      with tempfile.TemporaryDirectory() as temp_dir:
                          with zipfile.ZipFile(temp_file, 'r') as zip_ref:
                              zip_ref.extractall(temp_dir)
                          
                          # Look for lambda-deployment-package.zip
                          lambda_package_path = os.path.join(temp_dir, 'lambda-deployment-package.zip')
                          
                          if os.path.exists(lambda_package_path):
                              print(f"Found lambda deployment package at {lambda_package_path}")
                              
                              # Read the lambda deployment package
                              with open(lambda_package_path, 'rb') as lambda_zip:
                                  lambda_zip_content = lambda_zip.read()
                              
                              # Update the Lambda function with the deployment package
                              response = lambda_client.update_function_code(
                                  FunctionName='la-marzocco-dashboard-updater',
                                  ZipFile=lambda_zip_content
                              )
                              
                              print(f"Lambda function updated successfully. New CodeSha256: {response.get('CodeSha256', 'Unknown')}")
                          else:
                              # List available files for debugging
                              available_files = []
                              for root, dirs, files in os.walk(temp_dir):
                                  for file in files:
                                      available_files.append(os.path.relpath(os.path.join(root, file), temp_dir))
                              
                              error_msg = f"lambda-deployment-package.zip not found. Available files: {available_files}"
                              print(error_msg)
                              raise Exception(error_msg)
                  
                  # Signal success to CodePipeline
                  codepipeline_client.put_job_success_result(jobId=job_id)
                  
                  return {
                      'statusCode': 200,
                      'body': json.dumps('Lambda function updated successfully')
                  }
                  
              except Exception as e:
                  print(f"Error: {str(e)}")
                  # Signal failure to CodePipeline
                  codepipeline_client = boto3.client('codepipeline')
                  codepipeline_client.put_job_failure_result(
                      jobId=job_id,
                      failureDetails={'message': str(e)}
                  )
                  raise e

  # IAM Role for Lambda Update Function
  LambdaUpdateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-update-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaUpdatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${ArtifactsBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - codepipeline:PutJobSuccessResult
                  - codepipeline:PutJobFailureResult
                Resource: '*'

Outputs:
  PipelineName:
    Description: Name of the CodePipeline
    Value: !Ref Pipeline
    Export:
      Name: !Sub '${AWS::StackName}-PipelineName'
  
  PipelineUrl:
    Description: URL of the CodePipeline in AWS Console
    Value: !Sub 'https://console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view'

  LaMarzoccoSecretName:
    Description: Name of the shared La Marzocco credentials secret
    Value: !Ref LaMarzoccoCredentials
    Export:
      Name: !Sub '${AWS::StackName}-LaMarzoccoSecretName'
    Export:
      Name: !Sub '${AWS::StackName}-PipelineUrl'
  
  ArtifactsBucket:
    Description: S3 bucket for pipeline artifacts
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${AWS::StackName}-ArtifactsBucket'
